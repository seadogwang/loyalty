server:
  port: 8083

spring:
  application:
    name: engine-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty}
    username: ${DB_USER:loyalty}
    password: ${DB_PASSWORD:loyalty}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    schemas: loyalty
    default-schema: loyalty
    locations: classpath:db/migration
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: engine-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.loyalty.*"
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.loyalty.common.db
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

loyalty:
  outbox:
    enabled: true
    batch-size: 50
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
